<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cheevodex: sign in with your RetroAchievements account</title>
    <meta name="description" content="Sign in to Cheevodex, a free companion for RetroAchievements: every game you have played as a numbered dex entry. Your API key stays in your browser.">
    <link rel="canonical" href="https://yozuryu.github.io/cheevodex/">
    <meta property="og:title" content="Cheevodex: a pocket companion for RetroAchievements">
    <meta property="og:description" content="Every game you have played on RetroAchievements as a numbered dex entry, with rings, activity, friends and your backlog.">
    <meta property="og:url" content="https://yozuryu.github.io/cheevodex/">
    <meta property="og:image" content="https://yozuryu.github.io/cheevodex-site/assets/og.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <!-- 1. Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./assets/tw-config.js"></script>
    <link rel="stylesheet" href="./assets/tokens.css">
    <link rel="stylesheet" href="./assets/ui.css">
    <link rel="stylesheet" href="./assets/motion.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Silkscreen&display=swap">

    <!-- 2. Base styles -->
    <style>
        html, body { background-color: var(--page); margin: 0; padding: 0; font-family: var(--font); }
    </style>

    <!-- 3. Import Map -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
        }
    }
    </script>

    <!-- 4. Babel: Translates JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone@7.21.8/babel.min.js"></script>

    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
</head>
<body class="bg-page">
    <div id="root"></div>
    <script type="text/babel" data-type="module" src="./login.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', { scope: './' });
      }
    </script>
    <script src="./assets/pwa-install.js"></script>
</body>
</html>
